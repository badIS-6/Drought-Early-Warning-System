<!-- 
TUNISIA DROUGHT EARLY WARNING SYSTEM
WEBSITE INTEGRATION CODE

CODE FILES: 
   assets/app.js
   assets/style.css
   assets/chart.umd.js

INPUT:
   output/final_drought_latest.csv
   output/latest.json
   output/governorates_latest.geojson
   output/governorates/TN_XX.json
   output/timeseries/TN_XX.json

-->  

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunisia Drought Early Warning System</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="assets/chart.umd.js"></script>

    <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

    <div id="header">
        Tunisia Drought Early Warning System
        <div style="margin-left: auto; font-size: 14px;">
            <a href="index.html" style="color: #00ff88; text-decoration: none; font-weight: bold; padding: 5px 10px; border: 1px solid #00ff88; border-radius: 4px; background: rgba(0,255,136,0.1);">Interactive Map</a>
            <a href="about.html" style="color: #64748b; text-decoration: none; padding: 5px 10px; margin-left: 10px; transition: 0.3s;">About</a>
        </div>
    </div>
    
    <div id="main">
        <div id="sidebar">
            <!-- National Summary -->
            <div class="card">
                <h3>National Summary</h3>
                <p><b>Date:</b> <span id="latest-date">Loading...</span></p>
                <p><b>Governorates:</b> <span id="gov-count">24</span></p>                
                <p><b>Severe / Extreme:</b> <span id="severe-count">-</span></p>
                <p><b>Affected Cropland:</b> <span id="affected-cropland">-</span></p>
            </div>
            
            <!-- Governorate Panel -->
            <div class="card">
                <h3>Governorate Intelligence</h3>
                <div id="gov-panel">Select a governorate on the map...</div>
                <div id="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script src="assets/app.js"></script>
    
</body>
</html>
